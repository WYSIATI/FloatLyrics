name: macOS build

on:
  push:
    branches: [main]
    paths:
      - 'Sources/**'
      - 'Tests/**'
      - 'Resources/**'
      - 'scripts/*.sh'
      - 'scripts/make-icon.swift'
      - 'Package.swift'
      - '.github/workflows/**'
      - 'LICENSE'
      - 'NOTICE.md'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Test playback, lyrics and appearance
        run: swift test
      - name: Package universal public preview
        run: bash scripts/package-dmg.sh
      - name: Verify installer and checksum
        run: |
          bash scripts/verify-dmg.sh
          cd dist
          shasum -a 256 -c SHA256SUMS.txt
